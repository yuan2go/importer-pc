name: Industrial core
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: industrial-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  IPC_VERIFICATION_WITHOUT_VENDOR_RUNTIME: '1'
jobs:
  core-regression:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify current offline guide links and fault coverage
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          python scripts/verify-industrial-docs.py
          exit $LASTEXITCODE
      - name: Locked restore and discovered core tests
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet test tests/Ipc.Core.Tests -c Release -p:RestoreLockedMode=true --settings scripts/industrial-coverage.runsettings --collect "Code Coverage;Format=cobertura" --logger "trx;LogFileName=core.trx" --results-directory .artifacts/core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          [xml]$testResult = Get-Content -LiteralPath .artifacts/core/core.trx -Raw
          $testCounters = $testResult.TestRun.ResultSummary.Counters
          if ([int]$testCounters.executed -lt 25 -or [int]$testCounters.failed -ne 0 -or [int]$testCounters.notExecuted -ne 0) { throw 'Core test discovery/execution is incomplete' }
          $requiredSuites = @('--sm-parameters', '--rcs-timeout-errors', '--parameter-refactor', '--parameter-guidance-startup', '--sm-round-lifecycle', '--sm-db12-continuation', '--sm-runtime-responsibility', '--sm-dispatch-resources', '--backup-consistency', '--stability-analysis', '--industrial-recovery', '--industrial-lifecycle', '--industrial-rollback', '--industrial-version-pruning', '--permanent-deletion-02', '--industrial-opaque-removal', '--industrial-quiet-deployment', '--industrial-diagnostics', '--station-single-camera', '--same-placement-29', '--live-devices-30', '--mvs-stop-reconnect', '--mvs-still-frames', '--state-journal', '--read-cadence', '--interrupted-scan-skip', '--work-card-current', '--history-detail-sheet', '--installation-receipts-04', '--first-configuration-03', '--dual-camera-performance', '--debug-no-isolation-31', '--management-mode', '--installer-storage-checks', '--storage-schema-only', '--log-readable', '--tilted-decode', '--mvid-reader')
          $actualResults = @($testResult.TestRun.Results.UnitTestResult)
          foreach ($suite in $requiredSuites) {
            $matched = @($actualResults | Where-Object { $_.testName.Contains($suite) })
            if ($matched.Count -ne 1 -or $matched[0].outcome -ne 'Passed') { throw "Required suite missing or incomplete: $suite" }
          }
          foreach ($action in @('ReviewRollback', 'Rollback', 'ReviewVersionPruning', 'PruneVersions', 'ResumeVersionPruning', 'SimpleUninstall', 'MediaUninstall')) {
            $matched = @($actualResults | Where-Object { $_.testName.StartsWith('NewVersionActionRequiresBegin (') -and $_.testName.Contains('"' + $action + '"') })
            if ($matched.Count -ne 1 -or $matched[0].outcome -ne 'Passed') { throw "Helper Begin gate test missing: $action" }
          }
          foreach ($method in @('UnknownAndOversizedTerminalRemainUnknown', 'VersionReviewUsesBoundedSummary', 'VersionReceiptDisclosesDisplayTruncation')) {
            $matched = @($actualResults | Where-Object { $_.testName -eq $method })
            if ($matched.Count -ne 1 -or $matched[0].outcome -ne 'Passed') { throw "Required helper boundary test missing: $method" }
          }
      - name: Verify whitespace across src and tests
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          ./scripts/verify-industrial-format.ps1
      - name: Verify actual child-process product coverage
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          python -m unittest discover -s scripts -p test_product_coverage.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_product_coverage.py --results .artifacts/core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content -LiteralPath .artifacts/core/product-coverage/summary.md | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Passive performance collector and statistics regression
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          python -m unittest discover -s scripts -p test_dual_camera_performance.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_stability_qualification.py -v
          exit $LASTEXITCODE
      - name: Release policy unit boundaries (no publisher qualification)
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          python -m unittest discover -s scripts -p test_commercial_delivery.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_deployment_compatibility.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_release_documents.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_mvid_runtime.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-signature-policy.ps1
      - name: Keep actual results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-results-${{ github.sha }}
          path: |
            .artifacts/core/core.trx
            .artifacts/core/product-coverage/product.cobertura.xml
            .artifacts/core/product-coverage/summary.json
            .artifacts/core/product-coverage/summary.md
          if-no-files-found: error
          retention-days: 14
  operator-print:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build source-bound searchable A4 guides
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          python -m venv .artifacts/print-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .artifacts/print-env/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r scripts/operator-print.requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .artifacts/print-env/Scripts/python.exe -m unittest discover -s scripts -p test_operator_print.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .artifacts/print-env/Scripts/python.exe scripts/build-operator-print.py --output .artifacts/operator-print/output/pdf
          exit $LASTEXITCODE
      - name: Keep generated guides and exact source manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-print-${{ github.sha }}
          path: |
            .artifacts/operator-print/output/pdf/*.pdf
            .artifacts/operator-print/output/pdf/print-manifest.json
            .artifacts/operator-print/output/pdf/OFL.txt
          if-no-files-found: error
          retention-days: 14
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        business: [Sportmaster, DirectPlc, WcsToPlc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build the actual desktop composition
        shell: pwsh
        env:
          IPC_BUSINESS: ${{ matrix.business }}
        run: |
          . ./scripts/project-environment.ps1
          dotnet build src/Ipc.Desktop -c Release "-p:BusinessModule=$env:IPC_BUSINESS" -p:RestoreLockedMode=true -m:1
          exit $LASTEXITCODE
      - name: Verify management entry status handoff
        if: matrix.business == 'Sportmaster'
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet build tests/Ipc.Desktop.UiVerification -c Release -p:RestoreLockedMode=true -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Desktop.UiVerification/bin/Release/net10.0-windows/Ipc.Desktop.UiVerification.dll $PWD.Path --management-entry-ordering
          $verificationExit = $LASTEXITCODE
          $evidence = (Get-Content -LiteralPath .artifacts/WINDOWS-WPF-EVIDENCE.txt -Raw).Trim()
          $lines = @(Get-Content -LiteralPath (Join-Path $evidence 'WINDOWS-WPF.log'))
          $lines | Set-Content -LiteralPath .artifacts/management-entry.log
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          $lines | Write-Output
          if ($verificationExit) { exit $verificationExit }
          if (@($lines | Where-Object { $_ -like 'PASS MANAGEMENT-ENTRY *' }).Count -ne 2 -or @($lines | Where-Object { $_ -like 'FAIL *' }).Count) { throw 'Management entry verification incomplete' }
      - name: Verify workstation layout, RCS results and continuous pictures
        if: matrix.business == 'Sportmaster'
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          $env:IPC_FROZEN_DESKTOP = Join-Path $PWD.Path 'src/Ipc.Desktop/bin/Release/net10.0-windows/Ipc.Desktop.dll'
          $failedSuites = @()
          foreach ($suite in @('operator-ux-18', 'rcs-no-destination-ui', 'paused-workstation', 'home-centered-states', 'camera-barcode-current', 'camera-round-ui', 'manual-supply-ui', 'manual-rcs-debug-ui', 'camera-settings-feedback', 'camera-filter-preview', 'continuous-pda-input', 'startup-read-failure')) {
            dotnet tests/Ipc.Desktop.UiVerification/bin/Release/net10.0-windows/Ipc.Desktop.UiVerification.dll $PWD.Path "--$suite"
            $verificationExit = $LASTEXITCODE
            $evidence = (Get-Content -LiteralPath .artifacts/WINDOWS-WPF-EVIDENCE.txt -Raw).Trim()
            $lines = @(Get-Content -LiteralPath (Join-Path $evidence 'WINDOWS-WPF.log'))
            $lines | Set-Content -LiteralPath ".artifacts/$suite.log"
            $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            $lines | Write-Output
            if ($verificationExit -or !@($lines | Where-Object { $_ -like 'PASS *' }).Count -or @($lines | Where-Object { $_ -like 'FAIL *' }).Count) { $failedSuites += $suite }
          }
          if ($failedSuites.Count) { throw "Failed workstation verification: $($failedSuites -join ', ')" }
      - name: Verify compact exit confirmation and owner release
        if: matrix.business == 'Sportmaster'
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet tests/Ipc.Desktop.UiVerification/bin/Release/net10.0-windows/Ipc.Desktop.UiVerification.dll $PWD.Path --station-exit-dialog
          $verificationExit = $LASTEXITCODE
          $evidence = (Get-Content -LiteralPath .artifacts/WINDOWS-WPF-EVIDENCE.txt -Raw).Trim()
          $lines = @(Get-Content -LiteralPath (Join-Path $evidence 'WINDOWS-WPF.log'))
          $lines | Set-Content -LiteralPath .artifacts/station-exit.log
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          $lines | Write-Output
          if ($verificationExit) { exit $verificationExit }
          if (@($lines | Where-Object { $_ -like 'PASS STATION-EXIT *' }).Count -ne 18 -or @($lines | Where-Object { $_ -like 'FAIL *' }).Count) { throw 'Station exit verification incomplete' }
      - name: Verify clean Windows installation storage without registration
        if: matrix.business == 'Sportmaster'
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet build tests/Ipc.Verification -c Release -p:RestoreLockedMode=true -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Verification/bin/Release/net10.0/Ipc.Verification.dll --clean-storage-defaults
          exit $LASTEXITCODE

  product-branch-evidence:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build the measured production and verification compositions
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet build tests/Ipc.Core.Tests -c Release -p:RestoreLockedMode=true -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build src/Ipc.Desktop -c Release -p:BusinessModule=Sportmaster -p:RestoreLockedMode=true -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/Ipc.Desktop.UiVerification -c Release -p:RestoreLockedMode=true -m:1
          exit $LASTEXITCODE
      - name: Collect actual branches on isolated binary copies
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          ./scripts/measure-product-branches.ps1 -Configuration Release -IncludeWpf -Output .artifacts/product-branches
      - name: Keep actual branch reports and incomplete coverage inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-branches-${{ github.sha }}
          path: |
            .artifacts/product-branches/*.json
            .artifacts/product-branches/*.opencover.xml
            .artifacts/product-branches/*.md
            .artifacts/product-branches/*.log
            .artifacts/product-branches/tests/*.trx
          if-no-files-found: error
          retention-days: 14
