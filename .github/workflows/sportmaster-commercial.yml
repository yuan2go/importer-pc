name: Sportmaster commercial engineering
on:
  pull_request:
    branches: [main, codex/p0-stability-01]
permissions:
  contents: read
concurrency:
  group: sportmaster-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  aqa01-boundaries:
    # Portable runtime/SQLite/loopback evidence complements the Windows medium
    # below; it is not vendor-protocol or field acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build AQA01 verification with locked dependencies
        run: dotnet build tests/Ipc.Application.Verification -c Release -p:RestoreLockedMode=true
      - name: Exercise ingress and command durability boundaries
        shell: bash
        run: |
          set -o pipefail
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --architecture-quality-remediation 2>&1 | tee aqa01-boundaries.log
      - name: Exercise stability custody, isolation, reads and retention
        shell: bash
        run: |
          set -o pipefail
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --win11-stability 2>&1 | tee stability-boundaries.log
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --upgrade-conflict-closure 2>&1 | tee history-upgrade-boundaries.log
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --retention-ingress 2>&1 | tee retention-ingress.log
          python3 -m unittest discover -s scripts -p test_stability_qualification.py -v 2>&1 | tee stability-collector.log
      - name: Exercise dual-camera startup failure and cancellation ownership
        shell: bash
        run: |
          set -o pipefail
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --dual-camera-communication 2>&1 | tee dual-camera-boundaries.log
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --parameter-guidance-startup 2>&1 | tee parameter-guidance-startup.log
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --deferred-connections 2>&1 | tee deferred-connections.log
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --sportmaster-rcs 2>&1 | tee confirmed-camera-rcs.log
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --rcs-timeout-errors 2>&1 | tee rcs-timeout-errors.log
      - name: Exercise process death, monotonic time, storage and ownership
        shell: bash
        run: |
          set -o pipefail
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --reliability-02 2>&1 | tee reliability-02.log
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --receipt-custody 2>&1 | tee receipt-custody.log
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --h02-crashes 2>&1 | tee reliability-02-crashes.log
      - name: Exercise latency capacity time and storage boundaries
        shell: bash
        run: |
          set -euo pipefail
          for case in stability-audit-fixes lifecycle-ux latency-projection-checks latency-details-checks latency-capacity-checks latency-storage-checks audit03-snapshots ux-commercial-presentation time-storage-fault-checks time-storage-atomic-checks time-storage-supervisor-checks time-storage-process-checks; do
            dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --$case 2>&1 | tee $case.log
          done
      - name: Retain the actual boundary result including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqa01-boundaries-${{ github.sha }}
          path: |
            time-storage-*.log
            reliability-02.log
            receipt-custody.log
            reliability-02-crashes.log
            aqa01-boundaries.log
            stability-boundaries.log
            history-upgrade-boundaries.log
            retention-ingress.log
            stability-collector.log
            dual-camera-boundaries.log
            parameter-guidance-startup.log
            deferred-connections.log
            confirmed-camera-rcs.log
            rcs-timeout-errors.log
            stability-audit-fixes.log
            lifecycle-ux.log
            latency-*-checks.log
            audit03-snapshots.log
            ux-commercial-presentation.log
          if-no-files-found: warn
          retention-days: 30
  p0-stability-boundaries:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/ui/sportmaster-task-redesign-20261020/source/aux.js
            !/docs/ui/sportmaster-task-redesign-v2-20261020/source/aux.js
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Isolated Simulation and owned process crash boundaries
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          New-Item -ItemType Directory -Force .artifacts/p0-stability | Out-Null
          dotnet build tests/Ipc.Application.Verification -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($case in @('stability-audit-fixes','time-storage-fault-checks','time-storage-atomic-checks','time-storage-supervisor-checks','time-storage-process-checks','p0-provider-identity','p0-deferred','p0-cleanup','p0-tcp','p0-tcp-components','p0-rcs','rcs-timeout-errors','p0-recovery','p0-supervisor','p0-unknown-restart','p0-task-validate','installer-change-guards')) {
            dotnet run --project tests/Ipc.Application.Verification -c Release --no-build -- . "--$case" *> ".artifacts/p0-stability/$case.log"
            if ($LASTEXITCODE) { Get-Content ".artifacts/p0-stability/$case.log"; exit $LASTEXITCODE }
          }
      - name: Production Dispatcher fatal boundary
        if: always()
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet run --project tests/Ipc.Desktop.UiVerification -c Release -- . --p0-crash-hooks *> .artifacts/p0-stability/wpf-crash-hooks.log
          if ($LASTEXITCODE) { Get-Content .artifacts/p0-stability/wpf-crash-hooks.log; exit $LASTEXITCODE }
          # No task registration, HKLM writes, SCM changes, installation or devices.
      - name: Existing Windows shortcut COM boundary
        if: always()
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet run --project tests/Ipc.Application.Verification -c Release --no-build -- . --installer-options *> .artifacts/p0-stability/installer-options.log
          if ($LASTEXITCODE) { Get-Content .artifacts/p0-stability/installer-options.log; exit $LASTEXITCODE }
      - name: Unicode shortcut COM in isolated process code pages
        if: always()
        shell: pwsh
        run: ./scripts/verify-shortcut-codepages.ps1 -Output D:/shortcut-codepages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shortcut-codepages-${{ github.sha }}
          path: D:/shortcut-codepages
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-stability-boundaries-${{ github.sha }}
          path: .artifacts/p0-stability
          retention-days: 30
  frozen-sportmaster:
    runs-on: windows-2025
    env:
      DOTNET_INSTALL_DIR: D:/tools/dotnet
      DOTNET_CLI_HOME: D:/DevCache/importer-pc/dotnet-home
      NUGET_PACKAGES: D:/DevCache/nuget/packages
      TEMP: D:/a/_temp
      TMP: D:/a/_temp
    timeout-minutes: 45
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
          # Preserve the Git blob; Windows worktrees cannot materialize AUX.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/ui/sportmaster-task-redesign-20261020/source/aux.js
            !/docs/ui/sportmaster-task-redesign-v2-20261020/source/aux.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Clean installation protected-directory regression
        run: |
          . ./scripts/project-environment.ps1
          dotnet run --project tests/Ipc.Verification/Ipc.Verification.csproj -- --initialize-isolated-ci-storage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Ipc.Verification/Ipc.Verification.csproj -- --clean-storage-bootstrap-elevated
      - name: Policy rejection tests
        run: |
          . ./scripts/project-environment.ps1
          python -m unittest discover -s scripts -p test_commercial_delivery.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_release_build.py -v
      - name: Freeze only the first commercial composition
        id: freeze_sportmaster
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          # PR checkout is GitHub's exact merge commit, not an ancestor of main.
          # --source is reserved for main-ancestor historical publication/reuse.
          # A local runner branch gives the installer a verifiable source name
          # while retaining GitHub's exact checked merge commit; never pushed.
          git switch -c codex/ci-sportmaster-${{ github.run_id }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release-windows.py --profile sportmaster --output D:/scd/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = Get-Content D:/scd/release/RELEASE.json -Raw | ConvertFrom-Json
          if ($release.SourceCommit -ne '${{ github.sha }}') { throw 'Frozen PR release differs from the checked merge commit' }
      - name: Protected local administrator boundary on Windows
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          $ErrorActionPreference = 'Stop'
          $release = Get-Content D:/scd/release/RELEASE.json -Raw | ConvertFrom-Json
          $package = @($release.Packages | Where-Object { $_.Application -eq 'sportmaster' -and $_.Target -eq 'win-x64' })
          if ($package.Count -ne 1) { throw 'Expected one verified Windows medium' }
          $media = Join-Path D:/scd/release ([IO.Path]::GetFileNameWithoutExtension($package[0].File))
          ./scripts/verify-administrator-broker.ps1 -Media $media -Output D:/scd/administrator-broker
          if (-not $?) { throw 'Actual Windows administrator boundary verification failed' }
      - name: Native first-configuration and parameter-shell regression
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          $ErrorActionPreference = 'Stop'
          $release = Get-Content D:/scd/release/RELEASE.json -Raw | ConvertFrom-Json
          $package = @($release.Packages | Where-Object { $_.Application -eq 'sportmaster' -and $_.Target -eq 'win-x64' })
          if ($package.Count -ne 1) { throw 'Expected one verified Windows medium' }
          $media = Join-Path D:/scd/release ([IO.Path]::GetFileNameWithoutExtension($package[0].File))
          ./scripts/verify-commercial-wpf.ps1 -Media $media -Output D:/scd/startup-experience -StartupExperience
          if (-not $?) { throw 'Frozen first-configuration regression failed' }
          ./scripts/verify-commercial-wpf.ps1 -Media $media -Output D:/scd/parameter-guidance -ParameterGuidanceStartup
          if (-not $?) { throw 'Frozen parameter guidance and deferred-startup regression failed' }
          ./scripts/verify-commercial-wpf.ps1 -Media $media -Output D:/scd/parameter-shell -ParameterShellPolish
          if (-not $?) { throw 'Frozen parameter-shell regression failed' }
          ./scripts/verify-commercial-wpf.ps1 -Media $media -Output D:/scd/task-hierarchy -TaskHierarchy
          if (-not $?) { throw 'Frozen task-hierarchy regression failed' }
      - name: Native frozen journeys and separate production rejection
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          $ErrorActionPreference = 'Stop'
          try {
            ./scripts/verify-sportmaster-delivery.ps1 -Release D:/scd/release -Output D:/scd/evidence
            if (-not $?) { throw 'Frozen verification did not return successfully' }
            # The helper validates the actual production FAIL JSON and throws on
            # any engineering failure. Its last native exit=1 is that expected
            # policy refusal, rather than this step's outcome.
            exit 0
          } catch {
            [Console]::Error.WriteLine($_)
            exit 1
          }
      - name: Native visual interactions on the same frozen medium
        if: ${{ !cancelled() && steps.freeze_sportmaster.outcome == 'success' }}
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          $ErrorActionPreference = 'Stop'
          try {
            $release = Get-Content D:/scd/release/RELEASE.json -Raw | ConvertFrom-Json
            $package = @($release.Packages | Where-Object { $_.Application -eq 'sportmaster' -and $_.Target -eq 'win-x64' })
            if ($package.Count -ne 1) { throw 'Expected one verified Sportmaster Windows medium' }
            $media = Join-Path D:/scd/release ([IO.Path]::GetFileNameWithoutExtension($package[0].File))
            # These read-only native processes use separate synthetic workspaces.
            # Retain all independent failures in one run; any failure still blocks packaging.
            $failures = @()
            foreach ($case in @(
              @{ Directory = 'visual'; VisualProductization = $true },
              @{ Directory = 'parameters-v3'; ParameterV3 = $true },
              @{ Directory = 'operator-administration'; ManagementMode = $true },
              @{ Directory = 'reliability-logs'; ReliabilityLogs = $true },
              @{ Directory = 'workstation-status-logs'; WorkstationStatusLogs = $true },
              @{ Directory = 'stability-seed'; StabilitySeedUpgrade = $true },
              @{ Directory = 'installer-first-run'; InstallerFirstRunUi = $true },
              @{ Directory = 'lifecycle'; LifecycleUx = $true }
            )) {
              $directory = $case.Directory
              $arguments = $case.Clone()
              $arguments.Remove('Directory')
              try {
                ./scripts/verify-commercial-wpf.ps1 -Media $media -Output "D:/scd/evidence/$directory" @arguments
                if (-not $?) { throw "Frozen $directory verification did not return successfully" }
              } catch {
                $failures += "$directory`: $($_.Exception.Message)"
                [Console]::Error.WriteLine($_)
              }
            }
            if ($failures.Count -ne 0) { throw ($failures -join '; ') }
            exit 0
          } catch {
            [Console]::Error.WriteLine($_)
            exit 1
          }
      - name: Package the verified medium as one native installer
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          $ErrorActionPreference = 'Stop'
          $release = Get-Content D:/scd/release/RELEASE.json -Raw | ConvertFrom-Json
          $package = @($release.Packages | Where-Object { $_.Application -eq 'sportmaster' -and $_.Target -eq 'win-x64' })
          if ($package.Count -ne 1) { throw 'Expected one verified Windows package' }
          $media = Join-Path D:/scd/release $package[0].File
          python scripts/package-installer.py --media $media --output D:/scd/installer *> D:/scd/installer-build.log
          $result = $LASTEXITCODE
          Get-Content D:/scd/installer-build.log -Tail 12
          if ($result -ne 0) { throw 'Same-source installer packaging failed' }
          $receipt = Get-Content D:/scd/installer-build.log -Tail 1 | ConvertFrom-Json
          if ($receipt.SourceCommit -ne '${{ github.sha }}' -or $receipt.Payload.SourceCommit -ne '${{ github.sha }}') { throw 'Installer source differs from checked medium' }
          $receipt | ConvertTo-Json -Depth 8 | Set-Content D:/scd/installer/INSTALLER.json -Encoding utf8NoBOM
      - name: Retain installable same-source delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sportmaster-installable-${{ github.sha }}
          path: |
            D:/scd/installer/*.exe
            D:/scd/installer/INSTALLER.json
            D:/scd/release/sportmaster-win-x64-*.zip
            D:/scd/release/RELEASE.json
            D:/scd/release/SHA256SUMS
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Keep actual receipts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportmaster-evidence-${{ github.sha }}
          path: |
            D:/scd/parameter-guidance/RESULT.json
            D:/scd/parameter-guidance/RUN.log
            D:/scd/parameter-guidance/WINDOWS-WPF.log
            D:/scd/parameter-guidance/*.png
            D:/scd/startup-experience/RESULT.json
            D:/scd/startup-experience/RUN.log
            D:/scd/startup-experience/WINDOWS-WPF.log
            D:/scd/startup-experience/*.png
            D:/scd/parameter-shell/RESULT.json
            D:/scd/parameter-shell/RUN.log
            D:/scd/parameter-shell/WINDOWS-WPF.log
            D:/scd/parameter-shell/*.png
            D:/scd/task-hierarchy/RESULT.json
            D:/scd/task-hierarchy/RUN.log
            D:/scd/task-hierarchy/WINDOWS-WPF.log
            D:/scd/task-hierarchy/*.png
            D:/scd/task-hierarchy/chain-*.json
            D:/scd/evidence/acceptance.json
            D:/scd/evidence/environment.json
            D:/scd/evidence/media.json
            D:/scd/evidence/*-gate.json
            D:/scd/evidence/core/RESULT.json
            D:/scd/evidence/core/RUN.log
            D:/scd/evidence/core/synthetic-data/batch-regressions/BATCH-RESULT.json
            D:/scd/evidence/wpf/RESULT.json
            D:/scd/evidence/wpf/RUN.log
            D:/scd/evidence/wpf/WINDOWS-WPF.log
            D:/scd/evidence/wpf/*.png
            D:/scd/evidence/visual/RESULT.json
            D:/scd/evidence/visual/RUN.log
            D:/scd/evidence/visual/WINDOWS-WPF.log
            D:/scd/evidence/visual/*.png
            D:/scd/evidence/parameters-v3/RESULT.json
            D:/scd/evidence/parameters-v3/RUN.log
            D:/scd/evidence/parameters-v3/WINDOWS-WPF.log
            D:/scd/evidence/parameters-v3/*.png
            D:/scd/evidence/operator-administration/*
            D:/scd/evidence/reliability-logs/RESULT.json
            D:/scd/evidence/reliability-logs/RUN.log
            D:/scd/evidence/reliability-logs/WINDOWS-WPF.log
            D:/scd/evidence/reliability-logs/*.png
            D:/scd/evidence/workstation-status-logs/*
            D:/scd/administrator-broker/RESULT.json
            D:/scd/administrator-broker/RUN.log
            D:/scd/evidence/removal/RESULT.json
            D:/scd/evidence/removal/RUN.log
            D:/scd/release/*.json
            D:/scd/release/*.log
            D:/scd/release/SHA256SUMS
            D:/scd/installer-build.log
            D:/scd/installer/INSTALLER.json
          retention-days: 30
          if-no-files-found: warn
