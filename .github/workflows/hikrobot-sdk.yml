name: Hikrobot current SDK boundaries
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
env:
  IPC_VERIFICATION_WITHOUT_VENDOR_RUNTIME: '1'
permissions:
  contents: read
jobs:
  driver-and-configuration:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/ui/sportmaster-task-redesign-20261020/source/aux.js
            !/docs/ui/sportmaster-task-redesign-v2-20261020/source/aux.js
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build current contract and SDK driver verification
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet build tests/Ipc.Application.Verification -c Release -p:RestoreLockedMode=true -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/Ipc.Drivers.Hikrobot.Probe -c Release "-p:IpcContractPath=${{ github.workspace }}/src/Ipc.Platform/bin/Release/net10.0/Ipc.Platform.dll" -p:RestoreLockedMode=true -m:1
          exit $LASTEXITCODE
      - name: Verify acquisition ownership, callback isolation and current schemas
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet tests/Ipc.Drivers.Hikrobot.Probe/bin/Release/net10.0/Ipc.Drivers.Hikrobot.Probe.dll --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --hikrobot-sdk-editing
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --barcode-producer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Application.Verification/bin/Release/net10.0/Ipc.Application.Verification.dll . --hikrobot-hardening
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/Ipc.Hikrobot.IndependentReview -c Release -p:RestoreLockedMode=true -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Hikrobot.IndependentReview/bin/Release/net10.0/Ipc.Drivers.Hikrobot.Probe.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/Ipc.Hikrobot.LocalSimulation -c Release -p:RestoreLockedMode=true -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Hikrobot.LocalSimulation/bin/Release/net10.0/Ipc.Drivers.Hikrobot.Probe.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_application_compatibility.py
          exit $LASTEXITCODE
      - name: Verify standalone reader core with synthetic frames
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet build services/BarcodeReader/Ipc.Reader.Verification -c Release -p:RestoreLockedMode=true -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet services/BarcodeReader/Ipc.Reader.Verification/bin/Release/net10.0/Ipc.Reader.Verification.dll
          exit $LASTEXITCODE
  native-parameter-editor:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/ui/sportmaster-task-redesign-20261020/source/aux.js
            !/docs/ui/sportmaster-task-redesign-v2-20261020/source/aux.js
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and run native synthetic SDK editing
        shell: pwsh
        run: |
          . ./scripts/project-environment.ps1
          dotnet build tests/Ipc.Desktop.UiVerification -c Release -p:BusinessModule=Sportmaster -p:SelfContained=false -p:RestoreLockedMode=true -m:1 -nr:false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Desktop.UiVerification/bin/Release/net10.0-windows/Ipc.Desktop.UiVerification.dll . --hikrobot-sdk-editing
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tests/Ipc.Desktop.UiVerification/bin/Release/net10.0-windows/Ipc.Desktop.UiVerification.dll . --barcode-producer
          exit $LASTEXITCODE
      - name: Retain synthetic HWND evidence
        if: always()
        shell: pwsh
        run: |
          $pointer='.artifacts/WINDOWS-WPF-EVIDENCE.txt'
          if (Test-Path $pointer) {
            New-Item -ItemType Directory -Path .artifacts/hikrobot-native -Force | Out-Null
            Copy-Item -LiteralPath ((Get-Content $pointer -Raw).Trim()) -Destination .artifacts/hikrobot-native -Recurse
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hikrobot-native-${{ github.sha }}
          path: .artifacts/hikrobot-native
          retention-days: 14
