name: Sportmaster commercial engineering
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sportmaster-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  frozen-sportmaster:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
          # Preserve the Git blob; Windows worktrees cannot materialize AUX.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/ui/sportmaster-task-redesign-20261020/source/aux.js
            !/docs/ui/sportmaster-task-redesign-v2-20261020/source/aux.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Policy rejection tests
        run: |
          python -m unittest discover -s scripts -p test_commercial_delivery.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_release_build.py -v
      - name: Freeze only the first commercial composition
        shell: pwsh
        run: |
          # PR checkout is GitHub's exact merge commit, not an ancestor of main.
          # --source is reserved for main-ancestor historical publication/reuse.
          # A local runner branch gives the installer a verifiable source name
          # while retaining GitHub's exact checked merge commit; never pushed.
          git switch -c codex/ci-sportmaster-${{ github.run_id }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release-windows.py --profile sportmaster --output C:/scd-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = Get-Content C:/scd-release/RELEASE.json -Raw | ConvertFrom-Json
          if ($release.SourceCommit -ne '${{ github.sha }}') { throw 'Frozen PR release differs from the checked merge commit' }
      - name: Native frozen journeys and separate production rejection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./scripts/verify-sportmaster-delivery.ps1 -Release C:/scd-release -Output C:/scd-evidence
            if (-not $?) { throw 'Frozen verification did not return successfully' }
            # The helper validates the actual production FAIL JSON and throws on
            # any engineering failure. Its last native exit=1 is that expected
            # policy refusal, rather than this step's outcome.
            exit 0
          } catch {
            [Console]::Error.WriteLine($_)
            exit 1
          }
      - name: Native visual interactions on the same frozen medium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $release = Get-Content C:/scd-release/RELEASE.json -Raw | ConvertFrom-Json
            $package = @($release.Packages | Where-Object { $_.Application -eq 'sportmaster' -and $_.Target -eq 'win-x64' })
            if ($package.Count -ne 1) { throw 'Expected one verified Sportmaster Windows medium' }
            $media = Join-Path C:/scd-release ([IO.Path]::GetFileNameWithoutExtension($package[0].File))
            ./scripts/verify-commercial-wpf.ps1 -Media $media -Output C:/scd-evidence/visual -VisualProductization
            if (-not $?) { throw 'Frozen visual verification did not return successfully' }
            ./scripts/verify-commercial-wpf.ps1 -Media $media -Output C:/scd-evidence/parameters-v3 -ParameterV3
            if (-not $?) { throw 'Frozen parameter V3 verification did not return successfully' }
            exit 0
          } catch {
            [Console]::Error.WriteLine($_)
            exit 1
          }
      - name: Package the verified medium as one native installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content C:/scd-release/RELEASE.json -Raw | ConvertFrom-Json
          $package = @($release.Packages | Where-Object { $_.Application -eq 'sportmaster' -and $_.Target -eq 'win-x64' })
          if ($package.Count -ne 1) { throw 'Expected one verified Windows package' }
          $media = Join-Path C:/scd-release $package[0].File
          python scripts/package-installer.py --media $media --output C:/scd-installer *> C:/scd-installer-build.log
          $result = $LASTEXITCODE
          Get-Content C:/scd-installer-build.log -Tail 12
          if ($result -ne 0) { throw 'Same-source installer packaging failed' }
          $receipt = Get-Content C:/scd-installer-build.log -Tail 1 | ConvertFrom-Json
          if ($receipt.SourceCommit -ne '${{ github.sha }}' -or $receipt.Payload.SourceCommit -ne '${{ github.sha }}') { throw 'Installer source differs from checked medium' }
          $receipt | ConvertTo-Json -Depth 8 | Set-Content C:/scd-installer/INSTALLER.json -Encoding utf8NoBOM
      - name: Retain installable same-source delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sportmaster-installable-${{ github.sha }}
          path: |
            C:/scd-installer/*.exe
            C:/scd-installer/INSTALLER.json
            C:/scd-release/sportmaster-win-x64-*.zip
            C:/scd-release/RELEASE.json
            C:/scd-release/SHA256SUMS
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Keep actual receipts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportmaster-evidence-${{ github.sha }}
          path: |
            C:/scd-evidence/acceptance.json
            C:/scd-evidence/environment.json
            C:/scd-evidence/media.json
            C:/scd-evidence/*-gate.json
            C:/scd-evidence/core/RESULT.json
            C:/scd-evidence/core/RUN.log
            C:/scd-evidence/wpf/RESULT.json
            C:/scd-evidence/wpf/RUN.log
            C:/scd-evidence/wpf/WINDOWS-WPF.log
            C:/scd-evidence/wpf/*.png
            C:/scd-evidence/visual/RESULT.json
            C:/scd-evidence/visual/RUN.log
            C:/scd-evidence/visual/WINDOWS-WPF.log
            C:/scd-evidence/visual/*.png
            C:/scd-evidence/parameters-v3/RESULT.json
            C:/scd-evidence/parameters-v3/RUN.log
            C:/scd-evidence/parameters-v3/WINDOWS-WPF.log
            C:/scd-evidence/parameters-v3/*.png
            C:/scd-evidence/removal/RESULT.json
            C:/scd-evidence/removal/RUN.log
            C:/scd-release/*.json
            C:/scd-release/*.log
            C:/scd-release/SHA256SUMS
            C:/scd-installer-build.log
            C:/scd-installer/INSTALLER.json
          retention-days: 30
          if-no-files-found: warn
